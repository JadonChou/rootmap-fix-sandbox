name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check broken.ts
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('broken.ts','utf8'); if(!s.includes(';')) { console.error('missing semicolon'); process.exit(1);} console.log('ok');"
